{% if updates %}
<ul class="timeline timeline-vertical timeline-compact">
    {% for update in updates %}
    <li>
        <div class="timeline-start text-sm text-base-content/60">
            {{ update.created_at|date:"M d, Y g:i A" }}
        </div>
        <div class="timeline-middle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 text-primary">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
            </svg>
        </div>
        <div class="timeline-end timeline-box">
            <p class="font-medium">{{ update.message }}</p>
            {% if update.created_by %}
            <p class="text-sm text-base-content/60">by {{ update.created_by.email }}</p>
            {% endif %}
        </div>
        <hr />
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="text-base-content/60 py-4">No updates yet.</p>
{% endif %}
