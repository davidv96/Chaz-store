{% load order_tags %}

<div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
    <div>
        <span class="text-base-content/60 text-sm">Current Status:</span>
        <span class="{{ order.status|status_badge }} badge-lg ml-2">{{ order.get_status_display }}</span>
    </div>

    {% if error %}
    <div class="alert alert-error text-sm">
        <span>{{ error }}</span>
    </div>
    {% endif %}

    {% if allowed_transitions %}
    <div class="flex flex-wrap gap-2">
        <span class="text-base-content/60 text-sm self-center">Actions:</span>
        {% for transition in allowed_transitions %}
        <form class="inline">
            {% csrf_token %}
            <input type="hidden" name="status" value="{{ transition }}">
            <button type="submit"
                    class="btn btn-sm
                        {% if transition == 'accepted' %}btn-info
                        {% elif transition == 'in_progress' %}btn-primary
                        {% elif transition == 'completed' %}btn-success
                        {% elif transition == 'cancelled' %}btn-error btn-outline
                        {% else %}btn-ghost{% endif %}"
                    hx-post="{% url 'orders:update_order_status' order.pk %}"
                    hx-target="#status-controls"
                    hx-swap="innerHTML"
                    hx-include="closest form"
                    hx-confirm="Change status to {% if transition == 'accepted' %}Accepted{% elif transition == 'in_progress' %}In Progress{% elif transition == 'completed' %}Completed{% elif transition == 'cancelled' %}Cancelled{% endif %}?">
                {% if transition == "accepted" %}Accept
                {% elif transition == "in_progress" %}Start Work
                {% elif transition == "completed" %}Mark Complete
                {% elif transition == "cancelled" %}Cancel
                {% endif %}
            </button>
        </form>
        {% endfor %}
    </div>
    {% else %}
    <span class="text-sm text-base-content/60">No further status changes available.</span>
    {% endif %}
</div>
