{% extends "dashboard/_staff_base.html" %}
{% load order_tags %}

{% block title %}Manage Orders{% endblock %}
{% block staff_title %}Orders{% endblock %}

{% block staff_content %}
    <div class="flex items-center justify-end mb-6">
        <a href="{% url 'orders:owner_order_create' %}" class="btn btn-primary btn-sm">+ Create Order</a>
    </div>

    <!-- Status Filter Tabs -->
    <div class="flex flex-wrap gap-2 mb-6" role="tablist">
        <button class="btn btn-sm {% if not request.GET.status %}btn-active btn-primary{% else %}btn-ghost{% endif %}"
                hx-get="{% url 'orders:owner_order_list' %}"
                hx-target="#order-list"
                hx-swap="innerHTML"
                hx-push-url="true">
            All
        </button>
        <button class="btn btn-sm {% if request.GET.status == 'pending' %}btn-active btn-warning{% else %}btn-ghost{% endif %}"
                hx-get="{% url 'orders:owner_order_list' %}?status=pending"
                hx-target="#order-list"
                hx-swap="innerHTML"
                hx-push-url="true">
            Pending
        </button>
        <button class="btn btn-sm {% if request.GET.status == 'quoted' %}btn-active btn-secondary{% else %}btn-ghost{% endif %}"
                hx-get="{% url 'orders:owner_order_list' %}?status=quoted"
                hx-target="#order-list"
                hx-swap="innerHTML"
                hx-push-url="true">
            Quoted
        </button>
        <button class="btn btn-sm {% if request.GET.status == 'accepted' %}btn-active btn-info{% else %}btn-ghost{% endif %}"
                hx-get="{% url 'orders:owner_order_list' %}?status=accepted"
                hx-target="#order-list"
                hx-swap="innerHTML"
                hx-push-url="true">
            Accepted
        </button>
        <button class="btn btn-sm {% if request.GET.status == 'in_progress' %}btn-active btn-primary{% else %}btn-ghost{% endif %}"
                hx-get="{% url 'orders:owner_order_list' %}?status=in_progress"
                hx-target="#order-list"
                hx-swap="innerHTML"
                hx-push-url="true">
            In Progress
        </button>
        <button class="btn btn-sm {% if request.GET.status == 'completed' %}btn-active btn-success{% else %}btn-ghost{% endif %}"
                hx-get="{% url 'orders:owner_order_list' %}?status=completed"
                hx-target="#order-list"
                hx-swap="innerHTML"
                hx-push-url="true">
            Completed
        </button>
        <button class="btn btn-sm {% if request.GET.status == 'cancelled' %}btn-active btn-error{% else %}btn-ghost{% endif %}"
                hx-get="{% url 'orders:owner_order_list' %}?status=cancelled"
                hx-target="#order-list"
                hx-swap="innerHTML"
                hx-push-url="true">
            Cancelled
        </button>
    </div>

    <!-- Order List -->
    <div id="order-list">
        {% include "orders/owner/_order_list_partial.html" %}
    </div>
{% endblock %}
