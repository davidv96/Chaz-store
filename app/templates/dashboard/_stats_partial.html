<div class="stats stats-vertical sm:stats-horizontal shadow w-full">
    <div class="stat">
        <div class="stat-title">Total Revenue</div>
        <div class="stat-value text-primary">${{ stats.total_revenue }}</div>
        <div class="stat-desc">From completed orders</div>
    </div>

    <div class="stat">
        <div class="stat-title">Total Orders</div>
        <div class="stat-value">{{ stats.total_orders }}</div>
        <div class="stat-desc">All time</div>
    </div>

    <div class="stat">
        <div class="stat-title">Pending</div>
        <div class="stat-value text-warning">{{ stats.pending_orders }}</div>
        <div class="stat-desc">Awaiting review</div>
    </div>

    <div class="stat">
        <div class="stat-title">In Progress</div>
        <div class="stat-value text-info">{{ stats.in_progress_orders }}</div>
        <div class="stat-desc">Currently active</div>
    </div>

    <div class="stat">
        <div class="stat-title">Avg Order Value</div>
        <div class="stat-value text-secondary">${{ stats.avg_order_value|floatformat:2 }}</div>
        <div class="stat-desc">Per completed order</div>
    </div>
</div>
