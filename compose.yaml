services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${STORE_DOMAIN:-localhost}
      DJANGO_HTTPS: ${ENABLE_HTTPS:-0}
      DJANGO_DB_PATH: /data/db/db.sqlite3
      DJANGO_MEDIA_ROOT: /data/media
      DJANGO_STATIC_ROOT: /data/static
    volumes:
      - database:/data/db
      - media:/data/media
      - static:/data/static

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      STORE_DOMAIN: ${STORE_DOMAIN:-localhost}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-0}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx:/etc/nginx/store:ro
      - ./deploy/nginx/configure.sh:/docker-entrypoint.d/40-store.sh:ro
      - static:/data/static:ro
      - media:/data/media:ro
      - acme:/var/www/acme:ro
      - certificates:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles: [letsencrypt]
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      STORE_DOMAIN: ${STORE_DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    entrypoint: ["/bin/sh", "/opt/certbot.sh"]
    volumes:
      - ./deploy/certbot.sh:/opt/certbot.sh:ro
      - acme:/var/www/acme
      - certificates:/etc/letsencrypt

volumes:
  database:
  media:
  static:
  acme:
  certificates:
